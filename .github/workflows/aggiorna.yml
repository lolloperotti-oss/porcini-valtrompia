name: Aggiorna Radar Funghi Notturno

on:
  schedule:
    - cron: '0 3 * * *' # Si avvia ogni notte alle 03:00
  workflow_dispatch: # Ti permette di avviarlo anche a mano con un tasto

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installa pacchetti
        run: pip install -r requirements.txt

      - name: Avvia il Motore
        run: python motore.py

      - name: Salva i nuovi dati sulla mappa
        run: |
          git config --global user.name "Radar Bot"
          git config --global user.email "bot@radar-funghi.local"
          git add stazioni_meteo.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento meteo notturno"
          git push
