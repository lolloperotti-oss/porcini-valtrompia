name: Aggiorna dati meteo porcini

on:
  schedule:
    - cron: '0 3 * * *'   # ogni notte alle 03:00 UTC (~05:00 in Italia)
  workflow_dispatch:        # ti permette anche di lanciarlo a mano dal tab "Actions"

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario per poter fare il commit/push dei file aggiornati

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa le dipendenze
        run: pip install requests

      - name: Esegui il motore ARPA
        run: python motore.py

      - name: Commit e push dei dati aggiornati
        run: |
          git config user.name "bot-porcini"
          git config user.email "bot@users.noreply.github.com"
          git add stazioni_meteo.json storico_pioggia.json
          git commit -m "Aggiornamento dati meteo $(date +'%d/%m/%Y %H:%M')" || echo "Nessuna modifica da salvare"
          git push
